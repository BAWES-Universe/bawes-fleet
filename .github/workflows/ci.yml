name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    name: Fleet schema + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation deps
        run: pip install pyyaml jsonschema
      - name: Run guardrail scan
        run: bash scripts/guardrail-scan.sh

  brick-profile:
    name: Brick profile checks (DA-gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml packaging
      - name: Profile syntax valid
        run: python3 -c "import yaml; yaml.safe_load(open('brick-profile/brick-profile.yaml')); print('profile yaml OK')"
      - name: Script compiles
        run: python3 -m py_compile brick-profile/brick_profile.py && echo "compile OK"
      - name: Enforcement is MECHANISM not advertisement (DA finding 1)
        run: |
          grep -q "a2a-policy.json" brick-profile/brick_profile.py || (echo "no a2a policy write" && exit 1)
          grep -q '"reject"' brick-profile/brick_profile.py || (echo "no reject list write" && exit 1)
          grep -q "apply_profile" brick-profile/brick_profile.py || (echo "no applier" && exit 1)
          echo "applier writes real a2a policy artifact"
      - name: Identity re-verifies CRYPTO, not plaintext (DA finding 2)
        run: |
          grep -q "verify_manifest" brick-profile/brick_profile.py || (echo "no JWS re-verify" && exit 1)
          grep -q "identity.json" brick-profile/brick_profile.py || (echo "no identity.json use" && exit 1)
          echo "identity checked against installer crypto-gated output"
      - name: Real probes, not presence checks (DA finding 3/5)
        run: |
          grep -q "discord.com/api" brick-profile/brick_profile.py || (echo "no Discord API probe" && exit 1)
          grep -q "probe_model" brick-profile/brick_profile.py || (echo "no model probe" && exit 1)
          grep -q "stamp_registry" brick-profile/brick_profile.py || (echo "no registry stamp" && exit 1)
          echo "verifier hits Discord API + model endpoint + registry for real"
      - name: Registry path must be absolute (DA N1)
        run: |
          grep -q "is_absolute" brick-profile/brick_profile.py || (echo "no absolute-path check" && exit 1)
          grep -q "/root/.hermes/notes/heartbeat-registry.jsonl" brick-profile/brick-profile.yaml || (echo "placeholder registry still shipped" && exit 1)
          echo "registry path absolute + real"
      - name: Proper version compare (DA finding 7)
        run: |
          grep -q "packaging.version" brick-profile/brick_profile.py || (echo "no Version compare" && exit 1)
          echo "version gate uses packaging.version"
      - name: No secrets — Discord token shape, JWS excluded (DA finding 6 + N2)
        run: |
          # JWS signatures (header.payload.sig) are legitimately dot-shaped — exclude manifest signature values.
          if grep -rqE "[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{20,}" . \
              --include="*.json" --include="*.yaml" --include="*.yml" --include="*.md" --include="*.py" \
              --exclude="*manifest*.json" 2>/dev/null; then
            echo "DISCORD-TOKEN-SHAPE SECRET LEAKED (outside manifest files)"; exit 1
          fi
          echo "no Discord-token-shaped secrets outside signed manifests"
