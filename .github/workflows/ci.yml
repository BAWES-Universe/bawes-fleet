name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    name: Fleet schema + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation deps
        run: pip install pyyaml jsonschema
      - name: Run guardrail scan
        run: bash scripts/guardrail-scan.sh
