name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    name: Fleet schema + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: No secrets — whole repo, Discord token shape, JWS excluded
        run: |
          # JWS signatures (header.payload.sig) are legitimately dot-shaped — exclude
          # manifest *.json so signatures don't self-match; catch real Discord tokens.
          if grep -rqE "[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{20,}" . \
             --include="*.json" --include="*.yaml" --include="*.yml" --include="*.md" \
             --exclude="*manifest*.json" --exclude="*.sig.json"; then
            echo "SECRET-LIKE PATTERN FOUND — check the repo (JWS manifests are excluded)"
            exit 1
          fi
          echo "secret scan clean"
      - name: Spawn package — syntax + real-crypto signature + A2A enforcement
        run: |
          pip install -q cryptography
          python3 -m py_compile spawn-package/spawn.py spawn-package/a2a_server.py
          # full probe suite: S1-S8 (spawn/crypto/fail-closed) + A1-A8 (A2A enforcement)
          # extracted verbatim from spawn-package/ci-spawn-package.yml (single source of truth)
          python3 - <<'PROBES'
          import json, base64, subprocess, tempfile, pathlib, os, re, sys, time, socket, threading, shutil
          import urllib.request, urllib.error
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          key = ec.generate_private_key(ec.SECP256R1())
          pub_pem = key.public_key().public_bytes(serialization.Encoding.PEM, serialization.PublicFormat.SubjectPublicKeyInfo).decode()
          def sign(m):
              body = {k: v for k, v in m.items() if k != "signature"}
              pb = json.dumps(body, sort_keys=True, separators=(",", ":")).encode()
              p64 = base64.urlsafe_b64encode(pb).rstrip(b"=").decode()
              hdr = base64.urlsafe_b64encode(json.dumps({"alg": "ES256", "typ": "JWT"}, sort_keys=True).encode()).rstrip(b"=").decode()
              sig = key.sign(f"{hdr}.{p64}".encode(), ec.ECDSA(hashes.SHA256()))
              r, s = decode_dss_signature(sig)
              jws = base64.urlsafe_b64encode(r.to_bytes(32, "big") + s.to_bytes(32, "big")).rstrip(b"=").decode()
              m["signature"] = {"issuer": "ci-test", "value": f"{hdr}.{p64}.{jws}"}
              return m
          def base_manifest(bid="ci-test-001"):
              return {"manifest_version": 1, "brick_id": bid, "person_id": "999999", "owner": "ci",
                      "hardware_owner": "ci", "kill_switch": "khalid",
                      "identity_card": {"name": "CI Test", "role": "citizen", "voice": "fixed"},
                      "skills": [], "seeded_knowledge": [], "backlog": ["T-CI"],
                      "wallet_ref": "banana-bank/wallet-ci-test.jsonl", "resource_links": [],
                      "toolsets": ["web", "vision", "session_search"], "model_chain": ["lm-studio"],
                      "min_hermes_version": "0.20", "rules": []}
          src = pathlib.Path("spawn-package/spawn.py").read_text()
          repl = f'ISSUER_KEYS = {{"ci-test": {json.dumps(pub_pem.strip())}}}'
          pathlib.Path("spawn-package/spawn_test.py").write_text(re.sub(r'ISSUER_KEYS = \{[^}]*\}', lambda _m: repl, src, flags=re.S))
          sys.path.insert(0, "spawn-package")
          wsrc = "spawn-package/worker_stub.py"
          def run_spawn(m, td, expect_ok=True, version="0.20.1"):
              mp = pathlib.Path(td)/"m.json"; mp.write_text(json.dumps(m, indent=1))
              stub = pathlib.Path(td)/"hermes"; stub.write_text(f"#!/bin/sh\necho 'Hermes Agent v{version} (2026.8.13)'\n"); stub.chmod(0o755)
              env = dict(os.environ, PATH=f"{td}:{os.environ['PATH']}")
              out = subprocess.run(["python3","spawn-package/spawn_test.py",str(mp),"--root",td,"--worker-src",wsrc], capture_output=True, text=True, env=env)
              if expect_ok: assert out.returncode==0 and "BRICK PACKAGED" in out.stdout, out.stderr[-400:]
              else: assert out.returncode!=0, f"expected rejection: {out.stdout[-200:]}"
          with tempfile.TemporaryDirectory() as td:
              run_spawn(sign(base_manifest()), td); bid="ci-test-001"
              for a in ["identity.json","manifest.json","death-warrant.json","model-chain.json","a2a-policy.json","heartbeat.py","headless_worker.py","keys/brick.pub","bank/entries.jsonl","bank/audit.jsonl","hindsight_bank.py"]:
                  assert (pathlib.Path(td)/bid/a).exists(), f"missing {a}"
              assert "registry" in (pathlib.Path(td)/bid/"heartbeat.py").read_text()
              m2=sign(base_manifest()); m2["owner"]="EVIL"; run_spawn(m2,td,expect_ok=False)
              m3=base_manifest(); m3["signature"]={"issuer":"ci-test","value":"eyJhbGciOiJub25lIn0.e30."}; run_spawn(m3,td,expect_ok=False)
              run_spawn(sign(base_manifest()),td,expect_ok=False,version="0.19.20")
              run_spawn(sign(base_manifest("dup-001")),td)
              m6=sign(base_manifest("dup-001")); m6["owner"]="EVIL-OWNER"; run_spawn(m6,td,expect_ok=False)
              m7=sign(base_manifest()); m7["toolsets"]=["terminal"]; run_spawn(m7,td,expect_ok=False)
              m8=sign(base_manifest()); del m8["kill_switch"]; run_spawn(m8,td,expect_ok=False)
          import a2a_server
          with tempfile.TemporaryDirectory() as td:
              root=pathlib.Path(td); bid="ci-test-001"; (root/bid).mkdir(parents=True)
              (root/bid/"identity.json").write_text(json.dumps({"brick_id":bid,"skills":["python"]}))
              (root/bid/"a2a-policy.json").write_text(json.dumps({"brick_id":bid,"allow":["web","vision","session_search"],"reject":["terminal","code_execution","memory","file","skill_manage"],"enforce_read_only":True,"bind":"outbound-only"}))
              tokd=root/bid/"tokens"; tokd.mkdir(); tok="scoped-test-token-1234567890"; tf=tokd/"peer-a"; tf.write_text(tok); os.chmod(tf,0o600)
              reg=root/"registry.jsonl"; reg.write_text(json.dumps({"brick_id":"peer-a","status":"alive","ts":time.time()})+"\n")
              s=socket.socket(); s.bind(("127.0.0.1",0)); port=s.getsockname()[1]; s.close()
              srv=a2a_server.A2AServer(("127.0.0.1",port),a2a_server.A2AHandler,{"brick_id":bid,"skills":["python"],"peers":{"peer-a":{"token":tok,"scope":["web"]}},"registry_peers":a2a_server.read_registry_peers(reg),"start":time.time()})
              threading.Thread(target=srv.serve_forever,daemon=True).start(); time.sleep(0.5)
              def get(path,token=None):
                  hdrs={"Authorization":f"Bearer {token}"} if token else {}
                  try: return urllib.request.urlopen(urllib.request.Request(f"http://127.0.0.1:{port}{path}",headers=hdrs),timeout=5).getcode()
                  except urllib.error.HTTPError as e: return e.code
              assert get("/identity")==401 and get("/identity","short")==401
              assert get("/a2a/handshake",tok)==200 and get("/a2a/peers",tok)==200
              assert get("/a2a/peers","wrong-token-1234567890")==401
              try:
                  urllib.request.urlopen(urllib.request.Request(f"http://127.0.0.1:{port}/job",data=b"{}",headers={"Authorization":f"Bearer {tok}"}),timeout=5)
                  raise SystemExit("POST allowed")
              except urllib.error.HTTPError as e: assert e.code==501, e.code
              srv.shutdown()
              bad=tokd/"peer-bad"; bad.write_text("token-12345678901234567890"); os.chmod(bad,0o644)
              try: a2a_server.load_peers(tokd); raise SystemExit("644 accepted")
              except SystemExit as e: assert "600" in str(e)
          # ---- hindsight bank probes (round-63: retain/recall/reflect, dedup, receipt gate, audit) ----
          import hindsight_bank as hb
          with tempfile.TemporaryDirectory() as td:
              bk = hb.HindsightBank(pathlib.Path(td) / "bank", "ci-test-001")
              # retain requires receipts (D-2: evidence-first)
              try:
                  bk.retain("topic", "learning", [])
                  raise SystemExit("BANK-1 FAIL: retain without receipts accepted")
              except hb.BankRejection as e:
                  assert "receipt" in str(e)
              # whitespace-only receipts rejected
              try:
                  bk.retain("topic2", "learning", ["   "])
                  raise SystemExit("BANK-1b FAIL: whitespace receipt accepted")
              except hb.BankRejection as e:
                  assert "receipt" in str(e)
              # fake receipt shape rejected (D-2 realness, not presence)
              try:
                  bk.retain("topic3", "learning", ["abc def"])
                  raise SystemExit("BANK-1c FAIL: fake receipt accepted")
              except hb.BankRejection as e:
                  assert "shape" in str(e)
              # happy retain — status ALWAYS claimed (self-verify impossible, D-3)
              r1 = bk.retain("docker lowercase", "repo names must be lowercase", ["T-UNIVERSE-008"])
              assert r1["status"] == "claimed"
              # duplicate topic rejected (topic-hash dedup, D-2)
              try:
                  bk.retain("DOCKER LOWERCASE", "dup", ["T-UNIVERSE-009"])
                  raise SystemExit("BANK-2 FAIL: duplicate topic accepted")
              except hb.BankRejection as e:
                  assert "duplicate" in str(e)
              # NFKC/whitespace-normalized dedup
              try:
                  bk.retain("docker  lowercase", "dup2", ["T-UNIVERSE-010"])
                  raise SystemExit("BANK-2b FAIL: ws-variant accepted")
              except hb.BankRejection as e:
                  assert "duplicate" in str(e)
              # recall finds own entry
              rc = bk.recall("docker")
              assert rc["hits"] and rc["hits"][0]["topic_hash"] == r1["retained"]
              # reflect synthesizes
              rf = bk.reflect("docker lowercase")
              assert rf["entries"] == 1 and "claimed" in rf["summary"]
              # claimed status only (no self-verify)
              st = bk.status()
              assert st["entries"] == 1 and st["claimed"] == 1 and st["verified"] == 0 and st["corrupt_rows"] == 0
              # audit logged retain + recall + reflect (+ rejections + status)
              audit = bk.audit_path.read_text().splitlines()
              ops = [json.loads(l)["op"] for l in audit]
              assert "retain" in ops and "recall" in ops and "reflect" in ops and "status" in ops
              # rejected ops logged with outcome=rejected
              rejected = [json.loads(l) for l in audit if json.loads(l).get("outcome") == "rejected"]
              assert len(rejected) >= 1
              # D-5 privacy: bank files mode 0600
              assert (pathlib.Path(td)/"bank"/"entries.jsonl").stat().st_mode & 0o777 == 0o600
              assert (pathlib.Path(td)/"bank"/"audit.jsonl").stat().st_mode & 0o777 == 0o600
              # corrupt row counted, not hidden (fail-open closed)
              with open(bk.entries_path, "a") as f:
                  f.write("{not-json}\n")
              rc2 = bk.recall("docker")
              assert rc2["corrupt_rows"] == 1
              st2 = bk.status()
              assert st2["corrupt_rows"] == 1
              # concurrency: flock prevents TOCTOU dupes (10 same-topic retains -> exactly 1)
              import threading
              errs = []
              def try_retain():
                  try:
                      bk.retain("concurrent topic", "learn", ["T-UNIVERSE-011"])
                  except hb.BankRejection as e:
                      errs.append(str(e))
              threads = [threading.Thread(target=try_retain) for _ in range(10)]
              for t in threads: t.start()
              for t in threads: t.join()
              assert len(errs) == 9, f"expected 9 rejections, got {len(errs)}"
              st3 = bk.status()
              assert st3["entries"] == 2 and st3["corrupt_rows"] == 1  # 1 happy + 1 concurrent, +corrupt
              # BANK-13: corrupt-only topic — re-retain allowed (surfaced via corrupt_rows, not silent).
              # The row is GENUINELY unreadable (invalid JSON) so the topic is gone from the dedup set.
              with open(bk.entries_path, "a") as f:
                  f.write('{"brick": "x", "ts": 0, "topic": "gone topic", "learning": "x", "receipt_ids": ["T-UNIVERSE-012"], "status": "claimed" NOT_JSON\n')
              # corrupt the second row: valid JSON but missing topic_hash -> counted corrupt
              with open(bk.entries_path, "a") as f:
                  f.write(json.dumps({"brick": "x", "ts": 0, "learning": "no hash"}) + "\n")
              st4 = bk.status()
              assert st4["corrupt_rows"] == 3, st4  # {not-json} + NOT_JSON + missing-topic_hash row
              # re-retain on "gone topic" is allowed (its only row is unreadable; dedup intact elsewhere)
              r_dead = bk.retain("gone topic", "relearned", ["T-UNIVERSE-013"])
              assert r_dead["status"] == "claimed"
              st5 = bk.status()
              assert st5["entries"] == 3 and st5["corrupt_rows"] == 3, st5
              print("BANK-13/14: corrupt-edge PASS (missing-hash counted, corrupt-only re-retain allowed+surfaced)")
              print("BANK-1..14: hindsight bank PASS (receipt gate+realness, dedup+NFKC, no-self-verify, audit, 0600, corrupt-count, flock)")
          # ---- hindsight bridge probes (hostile-DA hardened: auth, impersonation, dedup, content, 0600, 503) ----
          import bridge as br
          with tempfile.TemporaryDirectory() as td:
              idx = pathlib.Path(td) / "index"; tokd = pathlib.Path(td) / "tokens"; tokd.mkdir()
              (tokd / "brick-a.token").write_text("tok-a-1234567890123456"); os.chmod(tokd / "brick-a.token", 0o600)
              (tokd / "brick-b.token").write_text("tok-b-1234567890123456"); os.chmod(tokd / "brick-b.token", 0o600)
              b = br.Bridge(idx, tokd, "bridge-001")
              # index registration: metadata only — ANY extra field rejected (D-5), not just 'learning'
              for bad_field in ["learning", "learning_text", "body", "content", "summary", "nested"]:
                  try:
                      b.index("brick-a", [{"topic": "t", "receipt_ids": ["T-UNIVERSE-008"], bad_field: "secret"}])
                      raise SystemExit(f"BRIDGE-1 FAIL: {bad_field} ingested")
                  except ValueError as e:
                      assert "metadata" in str(e)
              # server-side hash: brick-supplied hash IGNORED + normalized (DA-3)
              r = b.index("brick-a", [{"topic": "docker  lowercase", "receipt_ids": ["T-UNIVERSE-008"], "topic_hash": "fabricated-hash"}])
              assert r["indexed"] == 1
              rows_a, _ = b._read_index()
              assert rows_a[0]["topic_hash"] == br.topic_hash("docker lowercase"), "server-side hash not enforced"
              # same topic, diff hash in body -> still deduped (server normalizes)
              r2 = b.index("brick-a", [{"topic": "DOCKER LOWERCASE", "receipt_ids": ["T-UNIVERSE-009"]}])
              assert r2["indexed"] == 0 and r2["dupes_skipped"] == 1
              # intra-call dedup: same hash twice in ONE registration (DA-3)
              r3 = b.index("brick-a", [{"topic": "synapse reg", "receipt_ids": ["T-UNIVERSE-007"]},
                                       {"topic": "SYNAPSE REG", "receipt_ids": ["T-UNIVERSE-007"]}])
              assert r3["indexed"] == 1 and r3["dupes_skipped"] == 1
              b.index("brick-b", [{"topic": "synapse registration", "receipt_ids": ["T-UNIVERSE-007"]}])
              # aggregated recall — metadata only, never raw text, normalized query
              rc = b.recall("docker lowercase")
              assert rc["hits"] and rc["hits"][0]["brick"] == "brick-a"
              assert all("learning" not in h for h in rc["hits"]), "raw content leaked"
              assert rc["bricks_indexed"] == 2
              # D-5 at rest: index + audit files mode 0600
              assert (idx / "index-brick-a.jsonl").stat().st_mode & 0o777 == 0o600
              assert (idx / "audit.jsonl").stat().st_mode & 0o777 == 0o600
              # fail-open: broken index path — recall + status degrade to 503, never crash (DA-6)
              bad_path = pathlib.Path(td) / "not-a-dir"
              bad_path.write_text("i am a file")
              b2 = br.Bridge(bad_path, tokd, "bridge-002")
              assert b2.recall("anything") == 503
              assert b2.status() == 503
              # empty query rejected (DA-10)
              assert b.recall("") == 503
              # HTTP-level impersonation: POST /index claiming another brick -> 403 (DA-5)
              class FakeHandler(br.BridgeHandler):
                  pass
              import http.server
              orig_headers = {}
              h = FakeHandler.__new__(FakeHandler)
              # exercise _caller_brick + 403 logic via a stub bridge handler
              stub = br.BridgeHandler.__new__(br.BridgeHandler)
              stub.bridge = b
              stub.headers = type("H", (), {"get": lambda self, k, d="": "Bearer tok-a-1234567890123456" if k == "Authorization" else d})()
              stub.path = "/index"
              stub.rfile = type("R", (), {"read": lambda self, n: b'{"brick": "brick-b", "rows": []}'})()
              stub.send_response = lambda code, *a: setattr(stub, "_code", code)
              stub.send_header = lambda *a: None
              stub.end_headers = lambda: None
              stub.wfile = type("W", (), {"write": lambda self, d: None})()
              stub._json = lambda code, obj: setattr(stub, "_json_out", (code, obj))
              stub.do_POST()
              assert stub._json_out[0] == 403, stub._json_out  # brick-b claimed by brick-a token
              print("BRIDGE-1..11: hindsight bridge PASS (auth-bound identity, impersonation 403, server hash, intra-call dedup, content-at-rest, 0600, 503-degrade, audit)")
              # audit: recall + index + rejections logged (D-1)
              audit = b.audit_path.read_text().splitlines()
              ops = [json.loads(l)["op"] for l in audit]
              assert "recall" in ops and "index" in ops
              rejected = [json.loads(l) for l in audit if json.loads(l).get("outcome") == "rejected"]
              assert len(rejected) >= 1  # content-reject logged
              print("BRIDGE-1..10: hindsight bridge PASS (auth-bound identity, impersonation guard, server hash, intra-call dedup, content-at-rest, 0600, 503-degrade, audit)")
          # ---- capability register probes (round-63 D-3: no self-verify via ingest+apply, held-out pool, guard-3) ----
          import capability_register as cr
          with tempfile.TemporaryDirectory() as td:
              reg_dir = pathlib.Path(td) / "reg"
              reg = cr.CapabilityRegister(reg_dir, "register-001")
              # seed evaluator registry: only registered non-earner critics can ingest
              (reg_dir / "evaluators.jsonl").write_text(
                  '{"id": "zeus", "role": "non-earner"}\n{"id": "da-critic", "role": "non-earner"}\n')
              os.chmod(reg_dir / "evaluators.jsonl", 0o600)
              # claim needs receipts (evidence-first, D-2)
              try:
                  reg.claim("topic", "cap", [], "brick-a")
                  raise SystemExit("REG-1 FAIL: claim without receipts")
              except ValueError as e:
                  assert "receipt" in str(e)
              # happy claim — status CLAIMED, never verified
              c = reg.claim("docker lowercase", "immaculate docker images", ["T-UNIVERSE-008", "T-UNIVERSE-008"], "ovh-server-001")
              assert c["status"] == "claimed"
              # duplicate topic rejected (D-2); case/space variant also rejected
              for dup in ["DOCKER LOWERCASE", "docker  lowercase"]:
                  try:
                      reg.claim(dup, "dup", ["T-UNIVERSE-009"], "brick-a")
                      raise SystemExit("REG-2 FAIL: duplicate accepted")
                  except ValueError as e:
                      assert "duplicate" in str(e)
              # CRIT-1 FIX: self-verify structurally impossible — evaluator == source rejected
              try:
                  reg.ingest(cr.topic_hash("docker lowercase"), cr.topic_hash("probe-a"),
                             0.2, 0.9, "ovh-server-001", "ovh-server-001", "pool-v1", "a"*16)
                  raise SystemExit("REG-3 FAIL: self-evaluation accepted")
              except ValueError as e:
                  assert "non-earner" in str(e)
              # unregistered evaluator rejected
              try:
                  reg.ingest(cr.topic_hash("docker lowercase"), cr.topic_hash("probe-a"),
                             0.2, 0.9, "random-guy", "ovh-server-001", "pool-v1", "a"*16)
                  raise SystemExit("REG-4 FAIL: unregistered evaluator accepted")
              except ValueError as e:
                  assert "non-earner" in str(e)
              # verify WITHOUT ingest -> rejected (no self-attestable path)
              try:
                  reg.verify("docker lowercase", cr.topic_hash("probe-a"))
                  raise SystemExit("REG-5 FAIL: verify without ingest")
              except ValueError as e:
                  assert "ingested" in str(e)
              # ingest by registered non-earner (zeus) — ok
              th = cr.topic_hash("docker lowercase")
              ing = reg.ingest(th, cr.topic_hash("probe-a"), 0.2, 0.9, "zeus", "ovh-server-001", "pool-v1", "abc123def4567890")
              assert ing["status"] == "ingested"
              # probe bound to one topic: same probe_id on another topic rejected
              reg.claim("other topic", "cap2", ["T-UNIVERSE-009"], "brick-b")
              try:
                  reg.ingest(cr.topic_hash("other topic"), cr.topic_hash("probe-a"), 0.1, 0.5, "zeus", "brick-b", "pool-v1", "a"*16)
                  raise SystemExit("REG-6 FAIL: probe reused across topics")
              except ValueError as e:
                  assert "bound" in str(e)
              # verify now applies the ingested measurement — CLAIMED -> VERIFIED
              v = reg.verify("docker lowercase", cr.topic_hash("probe-a"))
              assert v["status"] == "verified" and v["improvement"] == 0.7
              # guard-3: re-ingest with LOWER after -> verify rejected (must beat best, not self-baseline)
              reg.ingest(th, cr.topic_hash("probe-b"), 0.1, 0.5, "zeus", "ovh-server-001", "pool-v2", "b"*16)
              try:
                  reg.verify("docker lowercase", cr.topic_hash("probe-b"))
                  raise SystemExit("REG-7 FAIL: regression verified")
              except ValueError as e:
                  assert "best" in str(e)
              st = reg.status()
              assert st["claimed"] == 1 and st["verified"] == 1 and st["measurements"] == 2
              # capability map: verified shows measurement with evaluator
              lst = reg.list()
              dv = [x for x in lst if x["topic"] == "docker lowercase"][0]
              assert dv["status"] == "verified" and dv["measurement"]["evaluator"] == "zeus"
              # corrupt row: surfaced, never crashes list/status (DA-5)
              with open(reg.claims_path, "a") as f:
                  f.write('{"topic_hash": "x"*64}\n')   # valid JSON, missing topic -> schema-counted
                  f.write("NOT_JSON\n")
              assert reg.status()["corrupt_rows"] == 2
              assert isinstance(reg.list(), list)        # no KeyError
              # audit: claim + ingest + verify + status + rejections all logged (D-1)
              audit = reg.audit_path.read_text().splitlines()
              ops = [json.loads(l)["op"] for l in audit]
              for need in ["claim", "ingest", "verify", "status"]:
                  assert need in ops, f"{need} not in audit"
              rejected = [json.loads(l) for l in audit if json.loads(l).get("outcome") == "rejected"]
              assert len(rejected) >= 4  # no-receipts, dup, self-eval, unregistered, no-ingest, bound, regression
              # D-5 privacy at rest
              for f in ["claims.jsonl", "measurements.jsonl", "audit.jsonl"]:
                  mode = (reg_dir / f).stat().st_mode & 0o777
                  assert mode == 0o600, f"{f} mode {mode:o}"
              print("REG-1..16: capability register PASS (no-self-verify ingest+apply, evaluator registry, probe binding, guard-3 best, corrupt surfaced, audit, 0600)")
          # ---- token router probes (T-UNIVERSE-013: vaulted secrets, SSRF guard, bill-once, owner-only) ----
          import token_router as tr
          with tempfile.TemporaryDirectory() as td:
              st = pathlib.Path(td) / "state"; tokd = pathlib.Path(td) / "tokens"; tokd.mkdir()
              (tokd / "brick-a.token").write_text("tok-a-1234567890123456"); os.chmod(tokd / "brick-a.token", 0o600)
              (tokd / "brick-b.token").write_text("tok-b-1234567890123456"); os.chmod(tokd / "brick-b.token", 0o600)
              rt = tr.TokenRouter(st, tokd, "router-001")
              rt._rebuild_token_index()
              # SSRF GUARD (finding 1): private/loopback/metadata endpoints rejected at register
