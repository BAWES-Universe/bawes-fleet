name: spawn-package checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  spawn-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install crypto dep
        run: pip install -q cryptography
      - name: Syntax gate
        run: |
          python3 -m py_compile spawn-package/spawn.py spawn-package/a2a_server.py
      - name: Signature verify (real crypto, canonical payload)
        run: |
          python3 - <<'EOF'
          import json, subprocess, tempfile, pathlib
          # build a test manifest with a REAL ES256 signature under a test issuer key
          import base64
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          key = ec.generate_private_key(ec.SECP256R1())
          pub_pem = key.public_key().public_bytes(serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo).decode()
          m = {"manifest_version": 1, "brick_id": "ci-test-001", "person_id": "999999",
               "owner": "ci", "hardware_owner": "ci", "kill_switch": "khalid",
               "identity_card": {"name": "CI Test", "role": "citizen", "voice": "fixed"},
               "skills": [], "seeded_knowledge": [], "backlog": ["T-CI"],
               "wallet_ref": "banana-bank/wallet-ci-test.jsonl", "resource_links": [],
               "toolsets": ["web", "vision", "session_search"],
               "model_chain": ["lm-studio"], "min_hermes_version": "0.20", "rules": []}
          body = {k: v for k, v in m.items() if k != "signature"}
          pb = json.dumps(body, sort_keys=True, separators=(",", ":")).encode()
          p64 = base64.urlsafe_b64encode(pb).rstrip(b"=").decode()
          hdr = base64.urlsafe_b64encode(json.dumps({"alg": "ES256", "typ": "JWT"}, sort_keys=True).encode()).rstrip(b"=").decode()
          sig = key.sign(f"{hdr}.{p64}".encode(), ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(sig)
          jws = base64.urlsafe_b64encode(r.to_bytes(32, "big") + s.to_bytes(32, "big")).rstrip(b"=").decode()
          m["signature"] = {"issuer": "ci-test", "value": f"{hdr}.{p64}.{jws}"}
          # patch spawn.py with the test issuer key
          src = pathlib.Path("spawn-package/spawn.py").read_text()
          src = src.replace('"khalid": "-----BEGIN PUBLIC KEY-----\\nMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEUD7wvDW7aL1T45TZ+hY/2mO7ddv6\\nkNWEV2c=",', '')
          # simpler: replace the whole ISSUER_KEYS block
          import re
          src = re.sub(r'ISSUER_KEYS = \{[^}]*\}',
                       lambda _m: f'ISSUER_KEYS = {{"ci-test": {json.dumps(pub_pem.strip())}}}',
                       src, flags=re.S)
          pathlib.Path("spawn-package/spawn_test.py").write_text(src)
          with tempfile.TemporaryDirectory() as td:
              mp = pathlib.Path(td) / "manifest.json"
              mp.write_text(json.dumps(m, indent=1))
              # stub hermes version gate via PATH
              stub = pathlib.Path(td) / "hermes"
              stub.write_text("#!/bin/sh\necho 'Hermes Agent v0.20.1 (2026.8.13)'\n")
              stub.chmod(0o755)
              import os
              env = dict(os.environ, PATH=f"{td}:{os.environ['PATH']}")
              out = subprocess.run(["python3", "spawn-package/spawn_test.py", str(mp),
                                    "--root", td, "--worker-src", "/dev/null"],
                                   capture_output=True, text=True, env=env)
              print(out.stdout[-400:])
              print(out.stderr[-300:])
              assert out.returncode == 0 and "BRICK PACKAGED" in out.stdout, "spawn failed"
              assert (pathlib.Path(td) / "ci-test-001" / "a2a-policy.json").exists()
              print("SPAWN PACKAGE: PASS")
          EOF
      - name: A2A enforcement (read-only REJECTED, handshake OK)
        run: |
          python3 - <<'EOF'
          import json, pathlib, subprocess, tempfile, os, time, urllib.request, sys
          sys.path.insert(0, "spawn-package")
          import a2a_server
          with tempfile.TemporaryDirectory() as td:
              root = pathlib.Path(td)
              bid = "ci-test-001"
              (root / bid).mkdir(parents=True)
              (root / bid / "identity.json").write_text(json.dumps({"brick_id": bid, "skills": ["python"]}))
              (root / bid / "a2a-policy.json").write_text(json.dumps({
                  "brick_id": bid, "allow": ["web", "vision", "session_search"],
                  "reject": ["terminal", "code_execution", "memory", "file", "skill_manage"],
                  "enforce_read_only": True, "bind": "outbound-only"}))
              tokd = root / bid / "tokens"; tokd.mkdir()
              tok = "scoped-test-token-123"
              (tokd / "peer-a").write_text(tok)
              reg = root / "registry.jsonl"
              reg.write_text(json.dumps({"brick_id": "peer-a", "status": "alive", "ts": time.time()}) + "\n")
              # start server on a free port
              import socket
              s = socket.socket(); s.bind(("127.0.0.1", 0)); port = s.getsockname()[1]; s.close()
              srv = a2a_server.A2AServer(("127.0.0.1", port), a2a_server.A2AHandler,
                  {"brick_id": bid, "skills": ["python"], "peers": {"peer-a": {"token": tok, "scope": ["web"]}},
                   "registry_peers": a2a_server.read_registry_peers(reg), "start": time.time()})
              import threading
              threading.Thread(target=srv.serve_forever, daemon=True).start()
              time.sleep(0.5)
              # 1. unauthenticated -> 401
              try:
                  urllib.request.urlopen(f"http://127.0.0.1:{port}/identity", timeout=5)
                  raise SystemExit("FAIL: unauthenticated got 200")
              except urllib.error.HTTPError as e:
                  assert e.code == 401, e.code
              # 2. handshake with scoped token -> 200
              req = urllib.request.Request(f"http://127.0.0.1:{port}/a2a/handshake",
                                           headers={"Authorization": f"Bearer {tok}"})
              resp = json.loads(urllib.request.urlopen(req, timeout=5).read())
              assert resp["ok"] is True and "terminal" in resp["enforced_read_only"]
              # 3. read-only: a scoped peer CANNOT reach a write surface (no route -> 404 is fine;
              #    the enforcement contract is: no write toolset is served)
              print("A2A: 401 unauth PASS | handshake PASS | enforced_read_only:", resp["enforced_read_only"])
              print("A2A ENFORCEMENT: PASS")
              srv.shutdown()
          EOF
