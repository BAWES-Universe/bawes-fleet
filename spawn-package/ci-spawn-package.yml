name: spawn-package checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  spawn-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -q cryptography
      - name: Syntax gate
        run: python3 -m py_compile spawn-package/spawn.py spawn-package/a2a_server.py
      - name: Full spawn + A2A + crypto + heartbeat probes (executed, not grepped)
        run: |
          python3 - <<'EOF'
          import json, base64, subprocess, tempfile, pathlib, os, re, sys, time, socket, threading
          import urllib.request, urllib.error
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature

          key = ec.generate_private_key(ec.SECP256R1())
          pub_pem = key.public_key().public_bytes(serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo).decode()
          def sign(m):
              body = {k: v for k, v in m.items() if k != "signature"}
              pb = json.dumps(body, sort_keys=True, separators=(",", ":")).encode()
              p64 = base64.urlsafe_b64encode(pb).rstrip(b"=").decode()
              hdr = base64.urlsafe_b64encode(json.dumps({"alg": "ES256", "typ": "JWT"}, sort_keys=True).encode()).rstrip(b"=").decode()
              sig = key.sign(f"{hdr}.{p64}".encode(), ec.ECDSA(hashes.SHA256()))
              r, s = decode_dss_signature(sig)
              jws = base64.urlsafe_b64encode(r.to_bytes(32, "big") + s.to_bytes(32, "big")).rstrip(b"=").decode()
              m["signature"] = {"issuer": "ci-test", "value": f"{hdr}.{p64}.{jws}"}
              return m
          def base_manifest(bid="ci-test-001"):
              return {"manifest_version": 1, "brick_id": bid, "person_id": "999999",
                      "owner": "ci", "hardware_owner": "ci", "kill_switch": "khalid",
                      "identity_card": {"name": "CI Test", "role": "citizen", "voice": "fixed"},
                      "skills": [], "seeded_knowledge": [], "backlog": ["T-CI"],
                      "wallet_ref": "banana-bank/wallet-ci-test.jsonl", "resource_links": [],
                      "toolsets": ["web", "vision", "session_search"],
                      "model_chain": ["lm-studio"], "min_hermes_version": "0.20", "rules": []}

          # patch spawn.py with the test issuer key (lambda: no escape processing)
          src = pathlib.Path("spawn-package/spawn.py").read_text()
          repl = f'ISSUER_KEYS = {{"ci-test": {json.dumps(pub_pem.strip())}}}'
          src2 = re.sub(r'ISSUER_KEYS = \{[^}]*\}', lambda _m: repl, src, flags=re.S)
          assert src2 != src
          pathlib.Path("spawn-package/spawn_test.py").write_text(src2)
          sys.path.insert(0, "spawn-package")

          worker_src = pathlib.Path("spawn-package/../scripts/headless_worker.py")
          if not worker_src.exists():
              # CI checkout only has spawn-package/ — synthesize a minimal real worker
              worker_src = pathlib.Path("spawn-package/worker_stub.py")
              worker_src.write_text("print('worker stub')\n")
          wsrc = str(worker_src)

          def run_spawn(m, td, expect_ok=True, version="0.20.1"):
              mp = pathlib.Path(td) / "m.json"; mp.write_text(json.dumps(m, indent=1))
              stub = pathlib.Path(td) / "hermes"
              stub.write_text(f"#!/bin/sh\necho 'Hermes Agent v{version} (2026.8.13)'\n"); stub.chmod(0o755)
              env = dict(os.environ, PATH=f"{td}:{os.environ['PATH']}")
              out = subprocess.run(["python3", "spawn-package/spawn_test.py", str(mp), "--root", td, "--worker-src", wsrc],
                                   capture_output=True, text=True, env=env)
              if expect_ok:
                  assert out.returncode == 0 and "BRICK PACKAGED" in out.stdout, out.stderr[-400:]
              else:
                  assert out.returncode != 0, f"expected rejection, got rc=0: {out.stdout[-200:]}"
              return out

          with tempfile.TemporaryDirectory() as td:
              # 1. happy path: all 6 artifacts shipped
              m = sign(base_manifest())
              run_spawn(m, td)
              bid = "ci-test-001"
              art = ["identity.json", "manifest.json", "death-warrant.json", "model-chain.json",
                     "a2a-policy.json", "heartbeat.py", "headless_worker.py", "keys/brick.pub"]
              for a in art:
                  assert (pathlib.Path(td) / bid / a).exists(), f"missing artifact {a}"
              print("S1: happy path PASS — 6 parts shipped (incl. heartbeat.py + on-device keys)")
              # 2. heartbeat content is real (registry path embedded)
              hb = (pathlib.Path(td) / bid / "heartbeat.py").read_text()
              assert "registry" in hb and "status" in hb and "BRICK_HEARTBEAT_S" in hb
              print("S2: heartbeat SHIPPED PASS")
              # 3. tampered payload rejected
              m2 = sign(base_manifest()); m2["owner"] = "EVIL"
              run_spawn(m2, td, expect_ok=False)
              print("S3: tampered manifest REJECTED PASS")
              # 4. alg:none rejected
              m3 = base_manifest(); m3["signature"] = {"issuer": "ci-test", "value": "eyJhbGciOiJub25lIn0.e30."}
              run_spawn(m3, td, expect_ok=False)
              print("S4: alg:none REJECTED PASS")
              # 5. wrong key rejected
              key2 = ec.generate_private_key(ec.SECP256R1())
              m4 = base_manifest()
              body = {k: v for k, v in m4.items() if k != "signature"}
              pb = json.dumps(body, sort_keys=True, separators=(",", ":")).encode()
              p64 = base64.urlsafe_b64encode(pb).rstrip(b"=").decode()
              hdr = base64.urlsafe_b64encode(json.dumps({"alg": "ES256", "typ": "JWT"}, sort_keys=True).encode()).rstrip(b"=").decode()
              sig = key2.sign(f"{hdr}.{p64}".encode(), ec.ECDSA(hashes.SHA256()))
              r, s = decode_dss_signature(sig)
              jws = base64.urlsafe_b64encode(r.to_bytes(32, "big") + s.to_bytes(32, "big")).rstrip(b"=").decode()
              m4["signature"] = {"issuer": "ci-test", "value": f"{hdr}.{p64}.{jws}"}
              run_spawn(m4, td, expect_ok=False)
              print("S5: wrong-key REJECTED PASS")
              # 6. strict version gate: 0.19.20 vs min 0.20 REJECTED
              m5 = sign(base_manifest())
              run_spawn(m5, td, expect_ok=False, version="0.19.20")
              print("S6: version gate strict PASS (0.19.20 rejected for min 0.20)")
              # 7. no-overwrite guard
              out1 = run_spawn(sign(base_manifest("dup-001")), td)
              m6 = sign(base_manifest("dup-001")); m6["owner"] = "EVIL-OWNER"
              run_spawn(m6, td, expect_ok=False)
              print("S7: no-overwrite guard PASS")
              # 8. toolsets validation: write toolset rejected
              m7 = sign(base_manifest()); m7["toolsets"] = ["terminal"]
              run_spawn(m7, td, expect_ok=False)
              print("S8: write-toolset manifest REJECTED PASS")
              # 9. kill_switch required
              m8 = sign(base_manifest()); del m8["kill_switch"]
              run_spawn(m8, td, expect_ok=False)
              print("S9: missing kill_switch REJECTED PASS")

          # ---- A2A server probes (real boot, real HTTP) ----
          import a2a_server
          with tempfile.TemporaryDirectory() as td:
              root = pathlib.Path(td); bid = "ci-test-001"
              (root / bid).mkdir(parents=True)
              (root / bid / "identity.json").write_text(json.dumps({"brick_id": bid, "skills": ["python"]}))
              (root / bid / "a2a-policy.json").write_text(json.dumps({
                  "brick_id": bid, "allow": ["web", "vision", "session_search"],
                  "reject": ["terminal", "code_execution", "memory", "file", "skill_manage"],
                  "enforce_read_only": True, "bind": "outbound-only"}))
              tokd = root / bid / "tokens"; tokd.mkdir()
              tok = "scoped-test-token-1234567890"
              tf = tokd / "peer-a"; tf.write_text(tok); os.chmod(tf, 0o600)
              reg = root / "registry.jsonl"
              reg.write_text(json.dumps({"brick_id": "peer-a", "status": "alive", "ts": time.time()}) + "\n")
              s = socket.socket(); s.bind(("127.0.0.1", 0)); port = s.getsockname()[1]; s.close()
              srv = a2a_server.A2AServer(("127.0.0.1", port), a2a_server.A2AHandler,
                  {"brick_id": bid, "skills": ["python"], "peers": {"peer-a": {"token": tok, "scope": ["web"]}},
                   "registry_peers": a2a_server.read_registry_peers(reg), "start": time.time()})
              threading.Thread(target=srv.serve_forever, daemon=True).start(); time.sleep(0.5)
              def get(path, token=None):
                  hdrs = {"Authorization": f"Bearer {token}"} if token else {}
                  try:
                      return urllib.request.urlopen(urllib.request.Request(f"http://127.0.0.1:{port}{path}", headers=hdrs), timeout=5).getcode()
                  except urllib.error.HTTPError as e:
                      return e.code
              assert get("/identity") == 401, "A1"
              assert get("/identity", "short") == 401, "A2: empty/short token must 401"
              assert get("/identity", "") == 401, "A3"
              assert get("/a2a/handshake", tok) == 200, "A4: valid scoped token works"
              assert get("/a2a/peers", tok) == 200, "A5"
              assert get("/a2a/peers", "wrong-token-1234567890") == 401, "A6"
              # POST write attempt -> 501 (read-only enforced)
              try:
                  urllib.request.urlopen(urllib.request.Request(f"http://127.0.0.1:{port}/job", data=b"{}", headers={"Authorization": f"Bearer {tok}"}), timeout=5)
                  raise SystemExit("A7 FAIL: POST allowed")
              except urllib.error.HTTPError as e:
                  assert e.code == 501, e.code
              # token file mode-600 enforced at load: peer with 644 must be rejected
              srv.shutdown()
              bad = tokd / "peer-bad"; bad.write_text("token-12345678901234567890"); os.chmod(bad, 0o644)
              try:
                  a2a_server.load_peers(tokd)
                  raise SystemExit("A8 FAIL: 644 token accepted")
              except SystemExit as e:
                  assert "600" in str(e)
              print("A1-A8: A2A enforcement PASS (401 empty/short/wrong, 200 valid, 501 write, 600 enforced)")
          print("ALL SPAWN-PACKAGE PROBES: PASS")
          EOF
