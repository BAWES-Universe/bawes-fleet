<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observability — BAWES</title>
<style>
:root{--bg:#04060d;--ink:#e9edf9;--mut:#9aa4c2;--dim:#6b7594;--gold:#f5c542;--teal:#3dd6a4;--red:#ff5d6c;--card:#0d1322;--line:#1a2233}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(900px 500px at 50% -10%,#141a26 0%,var(--bg));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:24px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:22px}.sub{color:var(--mut);font-size:13px;margin:6px 0 20px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase}
.LOW{color:var(--teal)}.MED{color:var(--gold)}.HIGH{color:var(--red)}
.chain{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.chain .item{border-left:2px solid var(--line);padding:8px 12px;margin:8px 0;font-size:13px}
.chain .item b{color:var(--gold)}
.note{margin-top:16px;color:var(--dim);font-size:12px}
</style></head>
<body>
<div class="wrap">
<h1>🔍 Fleet Observability</h1>
<div class="sub">Every agent's reliability, risk, and thought chain — transparent, accountable.</div>
<div id="agents">loading…</div>
<div id="chain" class="chain"></div>
<div class="note" id="note"></div>
</div>
<script>
async function load(){
  try{
    const r=await fetch("/api/observability",{cache:"no-store"});
    const d=await r.json();
    const ag=Object.values(d.agents||{});
    document.getElementById("agents").innerHTML=`<table><tr><th>Agent</th><th>Role</th><th>Reliability</th><th>Risk</th><th>Mints</th><th>🍌</th><th>Violations</th></tr>${
      ag.map(a=>`<tr><td>${a.name||a.id||"?"}</td><td>${a.role||"?"}</td><td>${a.reliability_pct||0}%</td><td class="${a.risk_label||'LOW'}">${a.hallucination_risk_pct||0}% ${a.risk_label||''}</td><td>${a.mints||0}</td><td>${a.bananas||0}</td><td>${a.violations||0}</td></tr>`).join("")}</table>`;
    document.getElementById("chain").innerHTML=`<div class="sub" style="margin:0 0 8px">Thought chain — recent decisions &amp; reasoning</div>${
      (d.thought_chain||[]).map(c=>`<div class="item"><b>${c.agent}</b> · ${c.action} — ${c.reasoning}<br><span style="color:var(--dim)">→ ${c.outcome}</span></div>`).join("")}`;
    document.getElementById("note").textContent=d.note||"";
  }catch(e){document.getElementById("agents").textContent="observability offline: "+e}
}
load();setInterval(load,15000);
</script>
</body></html>
