<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player World — BAWES</title>
<style>
:root{--bg:#04060d;--bg2:#080d1a;--ink:#e9edf9;--mut:#9aa4c2;--dim:#6b7594;--gold:#f5c542;--teal:#3dd6a4;--card:#0d1322;--line:#1a2233}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(900px 500px at 50% -10%,#141a26 0%,var(--bg));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:24px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.avatar{font-size:30px;float:left;margin-right:10px}
.name{font-weight:700;font-size:15px}
.cls{color:var(--mut);font-size:12px}
.lvl{color:var(--gold);font-weight:700;font-size:13px;margin-top:6px}
.bar{height:6px;background:#1a2233;border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--teal))}
.stats{display:flex;gap:12px;margin-top:10px;color:var(--dim);font-size:12px}
.you{border-color:var(--gold);box-shadow:0 0 12px rgba(245,197,66,.15)}
.badge{display:inline-block;background:var(--gold);color:#0a0c10;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:6px}
.foot{margin-top:24px;color:var(--dim);font-size:12px;line-height:1.7}
.act{display:flex;gap:8px;margin-top:12px}
.act button{flex:1;background:#141a26;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px;font-size:12px;cursor:pointer}
.act button:hover{border-color:var(--gold);color:var(--gold)}
</style></head>
<body>
<div class="wrap">
<h1>🌍 Player World</h1>
<div class="sub">The fleet as a game — every person and brick is a character. Follow · Compete · Collaborate.</div>
<div id="board" class="row">loading…</div>
<div class="foot" id="social"></div>
</div>
<script>
async function load(){
  try{
    const r=await fetch("/api/player-world",{cache:"no-store"});
    const d=await r.json();
    const board=document.getElementById("board");
    const players=Object.values(d.players||{}).sort((a,b)=>(a.rank||99)-(b.rank||99));
    board.innerHTML=players.map(p=>{
      const pct=Math.min(100,(p.xp%100));
      const you=p.name.startsWith("khalid")?' you':'';
      return `<div class="card${you}">
        <span class="avatar">${p.avatar||"🐒"}</span>
        <div class="name">${p.name}${you?'<span class="badge">YOU</span>':''}</div>
        <div class="cls">${p.class} · rank #${p.rank}</div>
        <div class="lvl">LVL ${p.level} · ${p.xp} XP</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="stats"><span>🍌 ${p.bananas}</span><span>◆ ${p.mints||0} mints</span></div>
        <div class="act"><button>Follow</button><button>Compete</button><button>Collab</button></div>
      </div>`;
    }).join("");
    document.getElementById("social").textContent=d.social||"";
  }catch(e){document.getElementById("board").textContent="world offline: "+e}
}
load();setInterval(load,15000);
</script>
</body></html>
